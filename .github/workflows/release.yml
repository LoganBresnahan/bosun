# Tag vX.Y.Z -> build and smoke every target natively (build.yml), then publish
# those exact bytes plus SHA256SUMS. Consumers (captAInHook's package.sh, pharos)
# pin a TAG and verify digests they keep in their own repo, never "latest": a
# silently updated binary would change consumer deploy bytes behind an
# unchanged source tree.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Cargo version matches the tag
        run: |
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml $v" >&2; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: built
      - name: Gather and checksum
        run: |
          mkdir dist
          cp built/*/bosun-* dist/
          (cd dist && sha256sum bosun-* > SHA256SUMS && cat SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "bosun ${GITHUB_REF_NAME#v}" --generate-notes
